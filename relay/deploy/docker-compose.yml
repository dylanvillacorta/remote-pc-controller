services:
  relay:
    build:
      context: ..
      dockerfile: Dockerfile
    image: remote-pc-controller-relay:latest
    container_name: remote-pc-relay
    restart: unless-stopped
    ports:
      # Vinculado estrictamente a loopback (127.0.0.1) para que solo Nginx local acceda
      - "127.0.0.1:8080:8080"
    # Carga variables desde el archivo .env
    env_file:
      - path: .env
        required: false
    environment:
      - LISTEN_ADDR=${LISTEN_ADDR}
      - API_SECRET=${API_SECRET}
      - DEVICE_ID=${DEVICE_ID}
      - SENTINEL_URL=${SENTINEL_URL}
      - PRIVATE_KEY=${PRIVATE_KEY}
      - VALIDITY_SECONDS=${VALIDITY_SECONDS}
      - MAX_BODY_BYTES=${MAX_BODY_BYTES}
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
